    <style>
        /* Realtime count styling */

        /* Global Styles & Background */
        html, body {
            width: 100%;
            height: 100dvh;
            min-height: 100dvh;
            overflow-x: hidden;
            overflow-y: hidden;
            background-color: #1a1a1a;
            color: white;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        button, a, input[type="range"] {
            touch-action: manipulation;
        }



        /* Glassmorphism Utilities */
        .glass-pill {
            background: rgba(30, 20, 20, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-player {
            background: linear-gradient(135deg, rgba(40, 20, 20, 0.6) 0%, rgba(20, 10, 10, 0.7) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .glass-card {
            background: rgba(40, 25, 25, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .glass-card:hover {
            transform: scale(1.05);
            background: rgba(50, 30, 30, 0.6);
        }

        /* Parchment Effect for Community Suggestions */
        .parchment-bg {
            background: #fdf5e6;
            background-image: 
                radial-gradient(circle, transparent 20%, #fdf5e6 20%, #fdf5e6 80%, transparent 80%, transparent),
                radial-gradient(circle, transparent 20%, #fdf5e6 20%, #fdf5e6 80%, transparent 80%, transparent) 25px 25px,
                linear-gradient(#efe8d4 2px, transparent 2px) 0 -1px,
                linear-gradient(90deg, #efe8d4 2px, #fdf5e6 2px) -1px 0;
            background-size: 50px 50px, 50px 50px, 25px 25px, 25px 25px;
            box-shadow: inset 0 0 20px rgba(139, 69, 19, 0.1), 0 5px 15px rgba(0,0,0,0.4);
            border: 1px solid #e3d5b8;
        }

        /* Glowing Dot Animation */
        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.7); }
            70% { box-shadow: 0 0 0 6px rgba(74, 222, 128, 0); }
            100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); }
        }
        .glowing-dot {
            animation: pulse-green 2s infinite;
        }

        .heavy-text-shadow {
            text-shadow: 0px 10px 30px rgba(0, 0, 0, 0.9), 0px 4px 10px rgba(0, 0, 0, 0.6);
        }

        .wah-button-active {
            transform: scale(0.95) !important;
        }

        /* Vinyl Record Animations */
        @keyframes slowSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .playing-record {
            animation: slowSpin 5s linear infinite;
        }
        .paused-record {
            animation-play-state: paused;
        }

        /* Floating Wah Emoji Animation */
        @keyframes floatUpWah {
            0% {
                opacity: 1;
                transform: translate(-50%, 0) scale(1) rotate(0deg);
            }
            50% {
                opacity: 0.9;
                transform: translate(-50%, -45px) scale(1.35) rotate(-12deg);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -100px) scale(1.6) rotate(12deg);
            }
        }
        .floating-wah {
            position: absolute;
            pointer-events: none;
            font-size: 2rem;
            animation: floatUpWah 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            z-index: 50;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
        }
        /* Progress bar: kill ALL native browser CSS transitions so the
           slider fill tracks audio.currentTime exactly — no interpolation,
           no visual vibration. Mobile WebKit applies a subtle fill-track
           transition by default on accent-color styled range inputs. */
        #progress-bar,
        #progress-bar-mobile {
            transition: none !important;
            -webkit-transition: none !important;
            animation: none !important;
            -webkit-animation: none !important;
        }
        #progress-bar::-webkit-slider-runnable-track,
        #progress-bar-mobile::-webkit-slider-runnable-track {
            transition: none !important;
            -webkit-transition: none !important;
        }
        #progress-bar::-webkit-slider-thumb,
        #progress-bar-mobile::-webkit-slider-thumb {
            transition: none !important;
            -webkit-transition: none !important;
        }
        #progress-bar::-moz-range-track,
        #progress-bar-mobile::-moz-range-track {
            transition: none !important;
        }
        #progress-bar::-moz-range-thumb,
        #progress-bar-mobile::-moz-range-thumb {
            transition: none !important;
        }
    </style>
</head>

    <script>
      // Initialize persistent per-tab sessionId early for presence socket
      (function(){
        try {
          let sessionId = sessionStorage.getItem('mehfil_session_id');
          if (!sessionId) {
            sessionId = 'sess_' + Math.random().toString(36).substring(2, 11) + '_' + Date.now();
            sessionStorage.setItem('mehfil_session_id', sessionId);
          }
          window.__mehfil_session_id = sessionId;
        } catch(e) {}
      })();
    </script>

    <script>
        // Prevent Flash of Wrong Theme by setting initial src synchronously
        (function() {
            let initialSrc = '';
            const isMobile = window.innerWidth < 768;
            const savedTheme = localStorage.getItem('mehfil_theme_mode') || 'auto';
            if (savedTheme === 'day') {
                initialSrc = isMobile ? './assets/backgrounds/Day p.jpeg' : './assets/backgrounds/Day2.jpeg';
            } else if (savedTheme === 'evening') {
                initialSrc = isMobile ? './assets/backgrounds/Evening p.jpeg' : './assets/backgrounds/Evening (2).jpeg';
            } else if (savedTheme === 'night') {
                initialSrc = isMobile ? './assets/backgrounds/Night newp9.jpeg' : './assets/backgrounds/Night.jpeg';
            } else {
                const h = new Date().getHours();
                if (h >= 6 && h < 18) {
                    initialSrc = isMobile ? './assets/backgrounds/Day p.jpeg' : './assets/backgrounds/Day2.jpeg';
                } else if (h >= 18 && h < 20) {
                    initialSrc = isMobile ? './assets/backgrounds/Evening p.jpeg' : './assets/backgrounds/Evening (2).jpeg';
                } else {
                    initialSrc = isMobile ? './assets/backgrounds/Night newp9.jpeg' : './assets/backgrounds/Night.jpeg';
                }
            }
            const baseLayer = document.getElementById('bg-layer-base');
            const overlayLayer = document.getElementById('bg-layer-overlay');
            if (baseLayer) baseLayer.src = initialSrc;
            if (overlayLayer) overlayLayer.src = initialSrc;
        })();
    </script>
    <script type="module">
      // Inline bridge: set window.MEHFIL_WS_URL at parse time so the presence socket can connect immediately
      try {
        const envWs = import.meta.env.VITE_MEHFIL_WS_URL;
        if (envWs && typeof envWs === 'string' && envWs.length) {
          window.MEHFIL_WS_URL = envWs;
          console.info('[MEHFIL WS] VITE_MEHFIL_WS_URL inlined', window.MEHFIL_WS_URL);
        } else {
          console.info('[MEHFIL WS] No VITE_MEHFIL_WS_URL available at build time');
        }
      } catch (e) {
        // import.meta.env only available in module contexts; ignore silently if not accessible
        console.info('[MEHFIL WS] import.meta.env access failed', e && e.message);
      }
    </script>

    <script>

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 🌄 MEHFIL THEME IMAGES CONFIGURATION (DESKTOP & MOBILE)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const DESKTOP_THEME_IMAGES = {
            day: "./assets/backgrounds/Day2.jpeg",
            evening: "./assets/backgrounds/Evening (2).jpeg",
            night: "./assets/backgrounds/Night.jpeg"
        };

        const MOBILE_THEME_IMAGES = {
            day: "./assets/backgrounds/Day p.jpeg",
            evening: "./assets/backgrounds/Evening p.jpeg",
            night: "./assets/backgrounds/Night newp9.jpeg"
        };

        // Theme State Management
        let activeThemeMode = localStorage.getItem('mehfil_theme_mode') || 'auto'; // 'day', 'evening', 'night', or 'auto'
        let currentDisplayedThemeState = null;
        let activeLayerIndex = 0; // 0: base layer, 1: overlay layer

        // Pre-cache all desktop and mobile theme images for zero-lag smooth crossfade
        [...Object.values(DESKTOP_THEME_IMAGES), ...Object.values(MOBILE_THEME_IMAGES)].forEach(src => {
            const img = new Image();
            img.src = src;
        });

        function getTimeBasedTheme() {
            const now = new Date();
            const hours = now.getHours(); // Local user/device hour (0-23)
            if (hours >= 6 && hours < 18) {
                return 'day'; // 6:00 AM – 5:59 PM
            } else if (hours >= 18 && hours < 20) {
                return 'evening'; // 6:00 PM – 7:59 PM
            } else {
                return 'night'; // 8:00 PM – 5:59 AM
            }
        }

        function getThemeImageSrc(themeKey) {
            const isMobile = window.innerWidth < 768;
            const themeMap = isMobile ? MOBILE_THEME_IMAGES : DESKTOP_THEME_IMAGES;
            return themeMap[themeKey] || themeMap.evening;
        }

        function applyTheme(targetThemeKey, force = false) {
            const isMobile = window.innerWidth < 768;
            const stateKey = `${targetThemeKey}_${isMobile ? 'mobile' : 'desktop'}`;

            if (!force && currentDisplayedThemeState === stateKey) return;
            currentDisplayedThemeState = stateKey;

            const targetImageSrc = getThemeImageSrc(targetThemeKey);
            const baseLayer = document.getElementById('bg-layer-base');
            const overlayLayer = document.getElementById('bg-layer-overlay');

            if (!baseLayer || !overlayLayer) return;

            if (activeLayerIndex === 0) {
                overlayLayer.src = targetImageSrc;
                overlayLayer.style.opacity = '1';
                baseLayer.style.opacity = '0';
                activeLayerIndex = 1;
            } else {
                baseLayer.src = targetImageSrc;
                baseLayer.style.opacity = '1';
                overlayLayer.style.opacity = '0';
                activeLayerIndex = 0;
            }
        }

            let effectiveTheme = activeThemeMode;
            if (activeThemeMode === 'auto') {

        }

        function updateThemeUIButtons() {
            const buttons = document.querySelectorAll('.theme-btn');
            buttons.forEach(btn => {
                const mode = btn.getAttribute('data-theme');
                if (mode === activeThemeMode) {
                    btn.classList.add('bg-white/20', 'text-amber-300', 'font-semibold');
                    btn.classList.remove('text-white/70');
                } else {
                    btn.classList.remove('bg-white/20', 'text-amber-300', 'font-semibold');
                    btn.classList.add('text-white/70');
                }
            });

            hours = hours ? hours : 12;

            const timeString = `${hours}:${minutes} ${ampm}`;
            const clockEl = document.getElementById('real-time-clock');
            if (clockEl) clockEl.textContent = timeString;

        // Media Session API Integration (OS-Level Media Controls)
        function registerMediaAction(action, handler) {
            if (!('mediaSession' in navigator)) return;
            try {
                navigator.mediaSession.setActionHandler(action, handler);
            } catch (error) {
                console.warn(`Media Session action "${action}" is not supported`, error);
            }
        }

        function updateMediaSessionMetadata() {
            if (!('mediaSession' in navigator)) return;
            const track = playlist[currentTrackIndex];
            if (!track) return;
            try {
                const coverUrl = track.cover ? new URL(track.cover, window.location.href).href : new URL('./assets/icons/images.jpg', window.location.href).href;
                
                let mimeType = 'image/jpeg';
                if (coverUrl.endsWith('.png')) mimeType = 'image/png';
                else if (coverUrl.endsWith('.webp')) mimeType = 'image/webp';

                navigator.mediaSession.metadata = new MediaMetadata({
                    title: track.title || 'Mehfil-e-Ghazal',
                    artist: track.artist || 'Ghazal Artist',
                    album: "Mehfil-e-Ghazal",
                    artwork: [
                        { src: coverUrl, sizes: "512x512", type: mimeType }
                    ]
                });
            } catch (err) {
                console.warn("MediaSession metadata update error:", err);
            }
        }

        function updateMediaSessionPositionState() {
            if (!('mediaSession' in navigator) || typeof navigator.mediaSession.setPositionState !== 'function') return;
            try {
                navigator.mediaSession.setPositionState(null);
            } catch (err) {}
        }

        let currentTrackIndex = 0;
        let pendingRestoredTime = null;
        let isInitialLoad = true;

        function getInitialTrackIndex() {
            try {
                const savedIndexRaw = localStorage.getItem('mehfil_current_track_index');
                const savedSrc = localStorage.getItem('mehfil_current_track_src');
                const savedTitle = localStorage.getItem('mehfil_current_track_title');

                if (savedSrc || savedTitle) {
                    const foundIndex = playlist.findIndex(track => 
                        (savedSrc && track.src === savedSrc) || 
                        (savedTitle && track.title === savedTitle)
                    );
                    if (foundIndex !== -1) return foundIndex;
                }

                if (savedIndexRaw !== null) {
                    const parsedIndex = parseInt(savedIndexRaw, 10);
                    if (!isNaN(parsedIndex) && parsedIndex >= 0 && parsedIndex < playlist.length) {
                        return parsedIndex;
                    }
                }
            } catch (e) {
                console.warn("Error reading saved track state:", e);
            }
            return 0;
        }

        function getSavedPlaybackPosition() {
            try {
                const rawTime = localStorage.getItem('mehfil_current_time');
                if (rawTime !== null) {
                    const parsedTime = parseFloat(rawTime);
                    if (!isNaN(parsedTime) && parsedTime > 0) {
                        return parsedTime;
                    }
                }
            } catch (e) {}
            return null;
        }

        function saveCurrentPlaybackTime() {
            if (!isSeeking && mainAudio && !isNaN(mainAudio.currentTime)) {
                try {
                    localStorage.setItem('mehfil_current_time', mainAudio.currentTime.toString());
                } catch (e) {}
            }
        }

        function handleNextTrack() {
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            loadTrack(currentTrackIndex, true);
        }

        function handlePrevTrack() {
            currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
            loadTrack(currentTrackIndex, true);
        }

        function setupMediaSessionActionHandlers() {
            if (!('mediaSession' in navigator)) return;
            registerMediaAction('play', () => { playTrack(); });
            registerMediaAction('pause', () => { pauseTrack(); });
            registerMediaAction('previoustrack', handlePrevTrack);
            registerMediaAction('nexttrack', handleNextTrack);
            registerMediaAction('seekbackward', null);
            registerMediaAction('seekforward', null);
            registerMediaAction('seekto', null);
        }

        // Initialize OS Media Session Action Handlers immediately on script load
        setupMediaSessionActionHandlers();

        // 🚀 HIGH-PERFORMANCE MOBILE AUDIO & TRACK ENGINE
        let activeTrackRequestId = 0;

        function loadTrack(index, shouldPlay = false) {
            currentTrackIndex = index;
            const requestId = ++activeTrackRequestId;

            // Save active track state to localStorage
            try {
                localStorage.setItem('mehfil_current_track_index', index.toString());
                if (playlist[index]) {
                    localStorage.setItem('mehfil_current_track_src', playlist[index].src);
                    localStorage.setItem('mehfil_current_track_title', playlist[index].title);
                }
            } catch (e) {}

            if (!isInitialLoad) {
                pendingRestoredTime = null;
                try {
                    localStorage.setItem('mehfil_current_time', '0');
                } catch (e) {}
            }

            // 1. Reset progress state for new track (timeupdate-driven, no RAF to cancel)
            lastDisplayedSeconds = -1;
            maxTimeSeen = 0;

            // 2. Set new track source FIRST (this binds browser media engine to the element)
            const track = playlist[index];
            mainAudio.src = track.src;

            // 3. Immediately update OS MediaSession Metadata & Playback State synchronously AFTER source binding
            updateMediaSessionMetadata();
            if ('mediaSession' in navigator) {
                try {
                    navigator.mediaSession.playbackState = shouldPlay ? "playing" : "paused";
                    updateMediaSessionPositionState();
                } catch (e) {}
            }

            // 4. Immediately trigger play/pause synchronously at top of user gesture stack
            if (shouldPlay) {
                playTrack();
            } else {
                pauseTrack();
            }

            // 5. Update Title, Artist & Album Cover INSTANTLY (single direct DOM update)
            trackTitle.textContent = track.title;
            trackArtist.textContent = track.artist;
            if (trackCover && track.cover) {
                trackCover.src = track.cover;
            }

            // 6. Reset progress bar & timestamps to 0:00 immediately
            if (progressBar) progressBar.value = 0;
            if (progressBarMobile) progressBarMobile.value = 0;
            if (currentTimeEl) currentTimeEl.textContent = '0:00';
            if (currentTimeElMobile) currentTimeElMobile.textContent = '0:00';
            if (totalDurationEl) totalDurationEl.textContent = '0:00';
            if (totalDurationElMobile) totalDurationElMobile.textContent = '0:00';

            // 7. Dynamic Spotify & YT Music Links
            const searchTerms = encodeURIComponent(`${track.title} ${track.artist}`);
            if (spotifyLink) spotifyLink.href = `https://open.spotify.com/search/${searchTerms}`;
            if (ytLink) ytLink.href = `https://music.youtube.com/search?q=${searchTerms}`;
        }

        function playTrack() {
            if ('mediaSession' in navigator) {
                try { navigator.mediaSession.playbackState = "playing"; } catch (e) {}
            }
            playIcon.classList.add('hidden');
            pauseIcon.classList.remove('hidden');
            if (recordContainer) {
                recordContainer.classList.add('playing-record');
                recordContainer.classList.remove('paused-record');
            }
            const playPromise = mainAudio.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    updateMediaSessionPositionState();
                }).catch(err => {
                    // If the user quickly tapped Next/Prev, previous play promise is aborted — do NOT pause
                    if (err.name !== 'AbortError') {
                        console.warn("Playback prevented or audio missing:", err);
                        pauseTrack();
                    }
                });
            }
        }

        function pauseTrack() {
            mainAudio.pause();
            playIcon.classList.remove('hidden');
            pauseIcon.classList.add('hidden');
            if (recordContainer) {
                recordContainer.classList.add('paused-record');
            }
            if ('mediaSession' in navigator) {
                try {
                    navigator.mediaSession.playbackState = "paused";
                    updateMediaSessionPositionState();
                } catch (e) {}
            }
            saveCurrentPlaybackTime();
        }

        playPauseBtn.addEventListener('click', () => {
            if (mainAudio.paused) {
                playTrack();
            } else {
                pauseTrack();
            }
        });

        prevBtn.addEventListener('click', handlePrevTrack);
        nextBtn.addEventListener('click', handleNextTrack);
        mainAudio.addEventListener('ended', handleNextTrack);

        // 2. Audio Player & Playlist Elements
        const progressBarMobile = document.getElementById('progress-bar-mobile');
        const currentTimeElMobile = document.getElementById('current-time-mobile');
        const totalDurationElMobile = document.getElementById('total-duration-mobile');
        const wahBtnMobile = document.getElementById('wah-btn-mobile');
        const clapCounterMobile = document.getElementById('clap-counter-mobile');

        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        let isSeeking = false;
        let lastDisplayedSeconds = -1;
        let maxTimeSeen = 0;

        function updateProgressUI() {
            if (isSeeking) return;
            if (!mainAudio || !mainAudio.duration || isNaN(mainAudio.duration) || mainAudio.duration <= 0) return;

            let current = mainAudio.currentTime;
            const duration = mainAudio.duration;

            // Enforce monotonically increasing time: never let the display go backward
            // during normal playback. Only resets happen on seek or track change.
            if (current < maxTimeSeen) {
                current = maxTimeSeen;
            } else {
                maxTimeSeen = current;
            }

            const pct = (current / duration) * 100;
            if (progressBar) progressBar.value = pct;
            if (progressBarMobile) progressBarMobile.value = pct;

            const currentSec = Math.floor(current);
            if (currentSec !== lastDisplayedSeconds) {
                lastDisplayedSeconds = currentSec;
                const formattedCurrent = formatTime(current);
                const formattedTotal = formatTime(duration);
                if (currentTimeEl) currentTimeEl.textContent = formattedCurrent;
                if (currentTimeElMobile) currentTimeElMobile.textContent = formattedCurrent;
                if (totalDurationEl) totalDurationEl.textContent = formattedTotal;
                if (totalDurationElMobile) totalDurationElMobile.textContent = formattedTotal;
                updateMediaSessionPositionState();
            }
        }

        // Single source of truth: timeupdate is the ONLY mechanism that drives progress.
        // No RAF, no setInterval — they caused race conditions and jitter on mobile.
        mainAudio.addEventListener('timeupdate', () => {
            updateProgressUI();
            saveCurrentPlaybackTime();
        });

        mainAudio.addEventListener('seeked', () => {
            // IMPORTANT: do NOT reset maxTimeSeen here.
            // 'seeked' fires on internal network buffering seeks too, not just user seeks.
            // Resetting maxTimeSeen here would lower the guard and let the slider jump back.
            // maxTimeSeen is ONLY reset by: (1) loadTrack on track change, and
            // (2) the user's slider change handler on an intentional seek.
            lastDisplayedSeconds = -1;
            updateProgressUI();
            updateMediaSessionPositionState();
            saveCurrentPlaybackTime();
        });

        function applyPendingRestoredTime() {
            if (pendingRestoredTime !== null && mainAudio.duration && !isNaN(mainAudio.duration)) {
                const targetTime = pendingRestoredTime;
                pendingRestoredTime = null;
                if (targetTime > 0 && targetTime < mainAudio.duration) {
                    try {
                        mainAudio.currentTime = targetTime;
                        maxTimeSeen = targetTime;
                        lastDisplayedSeconds = -1;
                    } catch (e) {
                        console.warn("Failed to restore currentTime:", e);
                    }
                }
            }
        }

        mainAudio.addEventListener('loadedmetadata', () => {
            applyPendingRestoredTime();
            if (mainAudio.currentTime > 0 && mainAudio.currentTime === mainAudio.duration) {
                mainAudio.currentTime = 0;
            }
            updateProgressUI();
            updateMediaSessionPositionState();
        });

        mainAudio.addEventListener('durationchange', () => {
            updateProgressUI();
            updateMediaSessionPositionState();
        });

        mainAudio.addEventListener('canplay', () => {
            applyPendingRestoredTime();
            updateMediaSessionPositionState();
        });

        mainAudio.addEventListener('ratechange', () => {
            updateMediaSessionPositionState();
        });

        window.addEventListener('beforeunload', saveCurrentPlaybackTime);
        window.addEventListener('pagehide', saveCurrentPlaybackTime);
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') {
                saveCurrentPlaybackTime();
            }
        });

        // Keep OS Media Controls active during track transition loading & buffering
        mainAudio.addEventListener('loadstart', () => {
            if ('mediaSession' in navigator) {
                try {
                    navigator.mediaSession.playbackState = "playing";
                    updateMediaSessionMetadata();
                } catch (e) {}
            }
            updateMediaSessionPositionState();
        });

        mainAudio.addEventListener('playing', () => {
            if ('mediaSession' in navigator) {
                try {
                    navigator.mediaSession.playbackState = "playing";
                    updateMediaSessionMetadata();
                    updateMediaSessionPositionState();
                } catch (e) {}
            }
        });

        mainAudio.addEventListener('waiting', () => {
            if ('mediaSession' in navigator) {
                try {
                    navigator.mediaSession.playbackState = "playing";
                } catch (e) {}
            }
        });

        function setupSeekListener(sliderEl) {
            if (!sliderEl) return;
            sliderEl.addEventListener('pointerdown', () => { isSeeking = true; });
            sliderEl.addEventListener('touchstart', () => { isSeeking = true; });
            sliderEl.addEventListener('input', () => {
                isSeeking = true;
                if (mainAudio.duration) {
                    const targetTime = (sliderEl.value / 100) * mainAudio.duration;
                    const formattedCurrent = formatTime(targetTime);
                    if (currentTimeEl) currentTimeEl.textContent = formattedCurrent;
                    if (currentTimeElMobile) currentTimeElMobile.textContent = formattedCurrent;
                }
            });
            sliderEl.addEventListener('change', () => {
                if (mainAudio.duration) {
                    mainAudio.currentTime = (sliderEl.value / 100) * mainAudio.duration;
                    maxTimeSeen = mainAudio.currentTime;
                    lastDisplayedSeconds = -1;
                }
                isSeeking = false;
                updateProgressUI();
                updateMediaSessionPositionState();
                saveCurrentPlaybackTime();
            });
            sliderEl.addEventListener('pointerup', () => { isSeeking = false; });
            sliderEl.addEventListener('touchend', () => { isSeeking = false; });
        }

        setupSeekListener(progressBar);
        setupSeekListener(progressBarMobile);

        // 3. Volume Control & Mute Logic (Desktop Inline & Mobile Popover)
        let lastVolume = 1;
        const volumePopover = document.getElementById('volume-popover');
        const volumeSliderMobile = document.getElementById('volume-slider-mobile');
        const volumePctLabel = document.getElementById('volume-pct-label');
        const volumePctDesktop = document.getElementById('volume-pct-desktop');

        function updateMuteIcon() {
            const vol = mainAudio.volume;
            let emoji = '🔊';
            if (vol === 0) {
                emoji = '🔇';
            } else if (vol < 0.5) {
                emoji = '🔉';
            }
            // Update only desktop text icon without modifying mobile img tag
            const desktopSpan = muteBtn ? muteBtn.querySelector('span.hidden.md\\:inline') : null;
            if (desktopSpan) {
                desktopSpan.textContent = emoji;
            }
            const pctStr = Math.round(vol * 100) + '%';
            if (volumePctLabel) {
                volumePctLabel.textContent = pctStr;
            }
            if (volumePctDesktop) {
                volumePctDesktop.textContent = pctStr;
            }
        }

        function syncVolume(val) {
            const numVal = parseFloat(val);
            if (isNaN(numVal)) return;
            mainAudio.volume = numVal;
            if (volumeSlider) volumeSlider.value = numVal;
            if (volumeSliderMobile) volumeSliderMobile.value = numVal;
            if (numVal > 0) lastVolume = numVal;
            updateMuteIcon();
            try {
                localStorage.setItem('mehfil_volume', numVal.toString());
            } catch(e) {}
        }

        if (volumeSlider) {
            volumeSlider.addEventListener('input', () => syncVolume(volumeSlider.value));
        }

        if (volumeSliderMobile) {
            volumeSliderMobile.addEventListener('input', () => syncVolume(volumeSliderMobile.value));
        }

        if (muteBtn) {
            muteBtn.addEventListener('click', (e) => {
                if (window.innerWidth < 768) {
                    e.stopPropagation();
                    if (volumePopover) {
                        volumePopover.classList.toggle('hidden');
                    }
                } else {
                    if (mainAudio.volume > 0) {
                        syncVolume(0);
                    } else {
                        syncVolume(lastVolume || 1);
                    }
                }
            });
        }

        document.addEventListener('click', (e) => {
            if (volumePopover && !volumePopover.classList.contains('hidden')) {
                if (!volumePopover.contains(e.target) && !muteBtn.contains(e.target)) {
                    volumePopover.classList.add('hidden');
                }
            }
        });

        // Restore saved volume
        let savedVolume = 1;
        try {
            const rawVol = localStorage.getItem('mehfil_volume');
            if (rawVol !== null) {
                const parsedVol = parseFloat(rawVol);
                if (!isNaN(parsedVol) && parsedVol >= 0 && parsedVol <= 1) {
                    savedVolume = parsedVol;
                }
            }
        } catch(e) {}
        syncVolume(savedVolume);

        // Restore initial track and playback position
        const initialTrackIdx = getInitialTrackIndex();
        pendingRestoredTime = getSavedPlaybackPosition();

        loadTrack(initialTrackIdx, false);
        isInitialLoad = false;

        // 4. Realtime WebSocket Presence & Shared WAH Server Connection
        (function initMehfilPresence() {
            if (window.__mehfil_presence_initialized) return;
            window.__mehfil_presence_initialized = true;

            const onlineCountEl = document.getElementById('online-count');
            const clapCounter = document.getElementById('clap-counter');
            const clapCounterMobile = document.getElementById('clap-counter-mobile');
            const wahBtn = document.getElementById('wah-btn');
            const wahBtnMobile = document.getElementById('wah-btn-mobile');

            let currentWahCount = 0;
            try {
                const saved = localStorage.getItem('mehfil_highest_wah_count');
                if (saved !== null) {
                    const parsed = parseInt(saved, 10);
                    if (!isNaN(parsed) && parsed >= 0) {
                        currentWahCount = parsed;
                    }
                }
            } catch (e) {}

            function getSessionId() {
                let sid = window.__mehfil_session_id || sessionStorage.getItem('mehfil_session_id');
                if (!sid) {
                    sid = 'sess_' + Math.random().toString(36).substring(2, 11) + '_' + Date.now();
                    try { sessionStorage.setItem('mehfil_session_id', sid); } catch(e) {}
                    window.__mehfil_session_id = sid;
                }
                return sid;
            }

            function spawnFloatingWah(containerEl) {
                const target = containerEl || (window.innerWidth < 768 ? wahBtnMobile : wahBtn);
                if (!target) return;
                const emoji = document.createElement('div');
                emoji.className = 'floating-wah';
                emoji.textContent = '👏';
                
                const offset = (Math.random() - 0.5) * 35;
                emoji.style.left = `calc(50% + ${offset}px)`;
                emoji.style.top = '10px';
                
                target.appendChild(emoji);
                setTimeout(() => emoji.remove(), 1200);
            }

            function updateWahUI(count, animate = false, sourceEl = null) {
                if (count === undefined || count === null) return;
                const formatted = Number(count).toLocaleString();
                if (clapCounter) clapCounter.textContent = formatted;
                if (clapCounterMobile) clapCounterMobile.textContent = formatted;
                
                if (animate) {
                    if (wahBtn) {
                        wahBtn.classList.add('wah-button-active');
                        setTimeout(() => wahBtn.classList.remove('wah-button-active'), 150);
                    }
                    if (wahBtnMobile) {
                        wahBtnMobile.classList.add('wah-button-active');
                        setTimeout(() => wahBtnMobile.classList.remove('wah-button-active'), 150);
                    }
                    spawnFloatingWah(sourceEl);
                }
            }

            // Immediately show persisted count on page load
            if (currentWahCount > 0) {
                updateWahUI(currentWahCount, false);
            }

            function processIncomingWahCount(receivedCount, animate = false, sourceEl = null) {
                if (typeof receivedCount !== 'number' || isNaN(receivedCount)) return;
                const num = Math.floor(receivedCount);
                if (num > currentWahCount) {
                    currentWahCount = num;
                    try { localStorage.setItem('mehfil_highest_wah_count', currentWahCount.toString()); } catch(e) {}
                    updateWahUI(currentWahCount, animate, sourceEl);
                } else if (num < currentWahCount && mgr.ws && mgr.ws.readyState === WebSocket.OPEN) {
                    try {
                        mgr.ws.send(JSON.stringify({ type: 'SYNC_WAH', count: currentWahCount }));
                    } catch (e) {}
                }
            }

            function updatePresenceUI(count) {
                if (count === undefined || count === null) return;
                if (onlineCountEl) {
                    onlineCountEl.textContent = `${count} Online`;
                }
            }

            function getWsEndpoint() {
                const sid = getSessionId();
                const param = `sessionId=${encodeURIComponent(sid)}`;

                if (window.MEHFIL_WS_URL && typeof window.MEHFIL_WS_URL === 'string' && window.MEHFIL_WS_URL.length) {
                    const sep = window.MEHFIL_WS_URL.includes('?') ? '&' : '?';
                    return `${window.MEHFIL_WS_URL}${sep}${param}`;
                }

                const host = window.location.hostname || 'localhost';
                const isLocal = (host === 'localhost' || host === '127.0.0.1' || host === '');
                const base = isLocal
                    ? `${window.location.protocol === 'https:' ? 'wss:' : 'ws:'}//${host}:3001`
                    : 'wss://mehfil-e-ghazal.onrender.com';
                return `${base}?${param}`;
            }

            const mgr = {
                ws: null,
                connecting: false,
                shouldReconnect: true,
                reconnectTimer: null,
                pingTimer: null,
                backoffMs: 1000
            };
            window.__mehfil_presence_manager = mgr;

            function connect() {
                if (!mgr.shouldReconnect) return;
                if (mgr.ws && (mgr.ws.readyState === WebSocket.OPEN || mgr.ws.readyState === WebSocket.CONNECTING)) return;
                if (mgr.connecting) return;
                mgr.connecting = true;

                const wsUrl = getWsEndpoint();
                console.info('[MEHFIL WS] Connecting to:', wsUrl);

                try {
                    const ws = new WebSocket(wsUrl);
                    mgr.ws = ws;

                    ws.addEventListener('open', () => {
                        console.info('[MEHFIL WS] Connected');
                        mgr.connecting = false;
                        mgr.backoffMs = 1000;

                        if (currentWahCount > 0) {
                            try {
                                ws.send(JSON.stringify({ type: 'SYNC_WAH', count: currentWahCount }));
                            } catch (e) {}
                        }

                        if (mgr.pingTimer) clearInterval(mgr.pingTimer);
                        mgr.pingTimer = setInterval(() => {
                            try {
                                if (mgr.ws && mgr.ws.readyState === WebSocket.OPEN) {
                                    mgr.ws.send(JSON.stringify({ type: 'PING' }));
                                }
                            } catch(e) {}
                        }, 4000);
                    });

                    ws.addEventListener('message', (evt) => {
                        try {
                            const msg = JSON.parse(evt.data);
                            if (msg.type === 'INIT_STATE') {
                                if (typeof msg.presenceCount === 'number') updatePresenceUI(msg.presenceCount);
                                if (typeof msg.wahCount === 'number') processIncomingWahCount(msg.wahCount, false);
                            } else if (msg.type === 'PRESENCE_COUNT' && typeof msg.count === 'number') {
                                updatePresenceUI(msg.count);
                            } else if (msg.type === 'WAH_COUNT' && typeof msg.count === 'number') {
                                processIncomingWahCount(msg.count, true);
                            }
                        } catch (e) { console.warn('[MEHFIL WS] Message parse error', e); }
                    });

                    ws.addEventListener('close', () => {
                        console.info('[MEHFIL WS] Connection closed');
                        mgr.connecting = false;
                        if (mgr.pingTimer) { clearInterval(mgr.pingTimer); mgr.pingTimer = null; }
                        mgr.ws = null;

                        if (mgr.shouldReconnect) {
                            if (mgr.reconnectTimer) clearTimeout(mgr.reconnectTimer);
                            mgr.reconnectTimer = setTimeout(() => {
                                mgr.backoffMs = Math.min(15000, mgr.backoffMs * 1.5);
                                connect();
                            }, mgr.backoffMs);
                        }
                    });

                    ws.addEventListener('error', (err) => {
                        console.warn('[MEHFIL WS] Error', err && err.message);
                        try { if (mgr.ws) mgr.ws.close(); } catch(e) {}
                    });

                } catch (e) {
                    console.warn('[MEHFIL WS] Connect exception', e && e.message);
                    mgr.connecting = false;
                    if (mgr.shouldReconnect) {
                        if (mgr.reconnectTimer) clearTimeout(mgr.reconnectTimer);
                        mgr.reconnectTimer = setTimeout(() => {
                            mgr.backoffMs = Math.min(15000, mgr.backoffMs * 1.5);
                            connect();
                        }, mgr.backoffMs);
                    }
                }
            }

            let lastWahClickTimestamp = 0;
            function handleWahClick(e) {
                if (e) {
                    e.stopPropagation();
                    e.preventDefault();
                }

                const now = Date.now();
                if (now - lastWahClickTimestamp < 150) return;
                lastWahClickTimestamp = now;

                currentWahCount += 1;
                try { localStorage.setItem('mehfil_highest_wah_count', currentWahCount.toString()); } catch(e) {}
                updateWahUI(currentWahCount, true, e ? e.currentTarget : null);

                if (mgr.ws && mgr.ws.readyState === WebSocket.OPEN) {
                    try {
                        console.info('[MEHFIL WS] Increment Wah sent');
                        mgr.ws.send(JSON.stringify({ type: 'INCREMENT_WAH', count: currentWahCount }));
                    } catch (err) { console.warn('[MEHFIL WS] Wah send error', err); }
                } else {
                    console.warn('[MEHFIL WS] Wah click while socket not connected');
                    connect();
                }

                if (typeof isWeb3Configured !== 'undefined' && isWeb3Configured && typeof window.ethereum !== 'undefined') {
                    triggerWeb3Wah();
                }
            }

            // Attach Wah click handlers exactly once
            if (wahBtn) {
                wahBtn.addEventListener('click', handleWahClick);
            }
            if (wahBtnMobile) {
                wahBtnMobile.addEventListener('click', handleWahClick);
            }

            connect();

            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') connect();
            });
            window.addEventListener('online', connect);

            window.addEventListener('beforeunload', () => {
                mgr.shouldReconnect = false;
                if (mgr.pingTimer) clearInterval(mgr.pingTimer);
                if (mgr.reconnectTimer) clearTimeout(mgr.reconnectTimer);
                try { if (mgr.ws) mgr.ws.close(); } catch (e) {}
            });
        })();
    </script>
